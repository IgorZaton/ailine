name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build, publish to PyPI, attach to GitHub Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}

    steps:
      - name: Checkout (with full history so the tag is visible)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pipx install "poetry==1.8.*"

      - name: Install poetry-dynamic-versioning plugin
        run: poetry self add "poetry-dynamic-versioning[plugin]"

      - name: Install project (with dev deps)
        run: poetry install --with dev --no-interaction

      - name: Run tests
        run: poetry run pytest -q

      - name: Build sdist and wheel
        run: poetry build

      - name: Show built artifacts
        run: ls -la dist/

      - name: Compute PEP 440 version from tag
        id: version
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          echo "value=${version}" >> "$GITHUB_OUTPUT"
          echo "Resolved version: ${version}"

      - name: Fail fast if PyPI token is missing
        env:
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          if [ -z "${PYPI_API_TOKEN}" ]; then
            echo "::error::Repository secret PYPI_API_TOKEN is not set; cannot publish to PyPI."
            exit 1
          fi

      - name: Publish to PyPI
        env:
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: poetry publish -u __token__ -p "${PYPI_API_TOKEN}" --no-interaction

      - name: Publish GitHub Release with artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}

  smoke-install-from-pypi:
    name: Smoke install from PyPI
    needs: build-and-release
    runs-on: ubuntu-latest

    steps:
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Wait for PyPI propagation
        run: sleep 30

      - name: Install ailine-core from PyPI in a fresh venv
        env:
          AILINE_VERSION: ${{ needs.build-and-release.outputs.version }}
        run: |
          set -euo pipefail
          python -m venv /tmp/ailine-smoke
          # shellcheck disable=SC1091
          source /tmp/ailine-smoke/bin/activate
          python -m pip install -U pip
          for attempt in 1 2 3 4 5; do
            if pip install "ailine-core==${AILINE_VERSION}"; then
              echo "Install succeeded on attempt ${attempt}"
              break
            fi
            echo "Install attempt ${attempt} failed; sleeping before retry"
            sleep 30
          done
          pip show ailine-core

      - name: Verify CLI entrypoints
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          source /tmp/ailine-smoke/bin/activate
          ailine --help
          ailine doctor --help
