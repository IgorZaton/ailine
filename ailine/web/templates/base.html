<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIline — {% block title %}{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='ailine_ui.css') }}" rel="stylesheet">
    <link href="{{ url_for('static', filename='ailine_code.css') }}" rel="stylesheet">
    {% block extra_head %}{% endblock %}
</head>
<body class="ailine-body">
    <nav class="navbar navbar-expand-lg ailine-navbar sticky-top">
        <div class="container">
            <a class="navbar-brand" href="{{ url_for('commits') }}">AIline</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                    aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto gap-lg-1">
                    <li class="nav-item">
                        <a class="nav-link {% if request.path == '/commits' %}active{% endif %}" href="/commits">Commits</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.path == '/experiments' %}active{% endif %}" href="/experiments">Experiments</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    <main class="container ailine-main">
        {% block content %}{% endblock %}
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    {% block extra_scripts %}{% endblock %}
</body>
</html>
