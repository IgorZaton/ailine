snapshot:
  exclude_globs:
    - ".git/**"
    - ".dvc/cache/**"
    - ".venv/**"
    - "__pycache__/**"
    - "*.pyc"
    - "*.pyo"
    - ".pytest_cache/**"
    - ".mypy_cache/**"
    - "mlruns/**"
    - ".ailine/**"
  large_file_mb: 50
  large_file_mode: prompt
  dvc_pointer_patterns:
    - "*.dvc"
dvc:
  mode: local_or_remote
  scope: all_dvc_tracked
  remote_name:
  auto_pull_missing: true
  require_hash_fields: true
  status_verbose_limit: 10
  ignore_paths: []
environment:
  enabled: true
  packages:
    - mlflow
    - flask
    - gitpython
    - dvc
run_capture:
  enabled: true
