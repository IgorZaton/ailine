project:
  version: 1
  mode: track          # track | demo

track:
  repo_root: auto       # 'auto' walks parents for .git; or absolute path
  mlflow:
    mode: inherit       # inherit | wrap | none
    set_env: false
  dvc:
    verify: "off"       # off | warn | strict
    verify_commands: []

snapshot:
  exclude_globs:
    - ".git/**"
    - ".dvc/cache/**"
    - ".venv/**"
    - "__pycache__/**"
    - "*.pyc"
    - "*.pyo"
    - ".pytest_cache/**"
    - ".mypy_cache/**"
    - "mlruns/**"
    - ".ailine/**"
    - ".cursor/**"
  large_file_mb: 50
  large_file_mode: prompt
  dvc_pointer_patterns:
    - "*.dvc"

dvc:
  remote_name:
  require_hash_fields: true
  ignore_paths: []

environment:
  enabled: true
  packages:
    - mlflow
    - dvc

run_capture:
  enabled: true
