[tool.poetry]
name = "ailine"
version = "0.1.0"
description = "ML experiment lineage tracker with snapshot-based reproducibility."
authors = ["Igor Zaton"]
readme = "README.md"
packages = [{ include = "ailine" }]
include = [
    { path = "ailine/web/templates/*.html", format = ["sdist", "wheel"] },
    { path = "ailine/web/static/*", format = ["sdist", "wheel"] },
]

[tool.poetry.dependencies]
python = "^3.12"
mlflow = "^2.21.2"
flask = "^3.1.0"
pyyaml = "^6.0.2"
zstandard = "^0.23.0"
dvc = "^3.67.1"
click = "^8.1.7"
gitpython = "^3.1.43"

[tool.poetry.scripts]
ailine = "ailine.cli.main:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
