[tool.poetry]
name = "ailine-core"
# Placeholder; the real value is computed at build time from the latest git tag
# by poetry-dynamic-versioning. See [tool.poetry-dynamic-versioning] below.
version = "0.0.0"
description = "ML experiment lineage tracker with snapshot-based reproducibility."
authors = ["Igor Zaton"]
license = "MIT"
readme = "README.md"
homepage = "https://github.com/IgorZaton/ailine"
repository = "https://github.com/IgorZaton/ailine"
documentation = "https://www.igorzaton.com/ailine/index.html"
keywords = ["mlops", "experiment-tracking", "lineage", "mlflow", "dvc", "reproducibility"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Version Control",
]
packages = [{ include = "ailine" }]
include = [
    { path = "ailine/web/templates/*.html", format = ["sdist", "wheel"] },
    { path = "ailine/web/static/*", format = ["sdist", "wheel"] },
    { path = "ailine/naming/data/*.txt", format = ["sdist", "wheel"] },
    { path = "LICENSE", format = ["sdist", "wheel"] },
]

[tool.poetry.dependencies]
python = "^3.12"
mlflow = "^2.21.2"
flask = "^3.1.0"
pyyaml = "^6.0.2"
zstandard = "^0.23.0"
dvc = "^3.67.1"
click = "^8.1.7"
gitpython = "^3.1.43"
pathspec = "^1.1.1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"

[tool.poetry.scripts]
ailine = "ailine.cli.main:main"

# MLflow auto-discovers run-context providers via this entry point group and
# applies their tags() output to every run created in the same Python env.
# Our provider is a no-op when AILINE_CORRELATION_ID is unset.
[tool.poetry.plugins."mlflow.run_context_provider"]
ailine_correlation_id = "ailine.integrations.mlflow_plugin:AilineRunContextProvider"

[tool.poetry-dynamic-versioning]
enable = true
vcs = "git"
style = "pep440"
# Accepts v0.2.0 and PEP 440 pre-releases such as v0.2.0rc1 / v0.2.0a1 / v0.2.0b2.
pattern = "^v(?P<base>\\d+\\.\\d+\\.\\d+)(?:(?P<stage>[a-z]+)(?P<revision>\\d+))?$"

[build-system]
requires = ["poetry-core>=1.5", "poetry-dynamic-versioning>=1.4"]
build-backend = "poetry_dynamic_versioning.backend"
